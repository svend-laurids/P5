[project]
name = "p5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "svend-laurids", email = "svendlauridsknudsen@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "orbit-count>=0.1.0",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
]

[project.scripts]
p5 = "p5:main"
download = "download:main"
process = "process:main"
stats = "stats:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

out_dir: results
dataset:
  format: PyG
  name: qm9-annotated
  task: graph 
  task_type: regression 
  split: [0.8, 0.2]
  transform: none
train:
  batch_size: 32
  eval_period: 20
  ckpt_period: 100
model:
  type: tgnn_network
  loss_fun: mse
  size_average: mean 
  edge_decoding: dot
  graph_pooling: add
tgnn_config:
  messagepassing: 'tgnn_linear'
  num_layers: 2
  dim_in: 11
  dim_inner: 19
  dim_out: 19
  aggregation: 'sum'
  activation: 'relu'
  has_batchnorm: true
  has_activation: true
  has_dropout: true
  dropout: 0.0
optim:
  optimizer: adam
  base_lr: 0.01
  max_epoch: 400

out_dir: results
dataset:
  format: PyG
  name: qm9-annotated
  task: graph 
  task_type: regression 
  split: [0.8, 0.2]
  transform: none
train:
  batch_size: 32
  eval_period: 20
  ckpt_period: 100
model:
  type: gnn
  loss_fun: mse
  size_average: mean 
  edge_decoding: dot
  graph_pooling: add
gnn:
  layers_pre_mp: 0
  layers_mp: 2
  layers_post_mp: 0
  dim_inner: 256
  layer_type: tgnn
  stage_type: stack
  batchnorm: true
  act: relu
  dropout: 0.0
  agg: add
optim:
  optimizer: adam
  base_lr: 0.01
  max_epoch: 400
